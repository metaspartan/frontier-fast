name: Runner application
description: Offer hardware as a trusted runner for a track
title: "Runner application: <device> for <track>"
labels: [runner-application]
body:
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: "e.g. Mac Studio M1 Ultra 128GB / DGX Spark GB10 / Radeon R 9700 32GB"
    validations: { required: true }
  - type: input
    id: track
    attributes:
      label: Track you want to host
      placeholder: "e.g. laguna-xs-2.1-nvfp4-mlx-apple-v1"
    validations: { required: true }
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Docker availability, network, typical uptime, cooling situation.
    validations: { required: true }
  - type: checkboxes
    id: commitments
    attributes:
      label: Commitments
      options:
        - label: The box can be dedicated to benchmark runs while a submission is being measured (~20 min at a time)
          required: true
        - label: I will run the unmodified runner container and keep my credential private
          required: true

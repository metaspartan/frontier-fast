name: patch series
on:
  pull_request:
    paths: ["Sources/patches/**", ".github/workflows/patch-series.yml"]
  push:
    branches: [main]
    paths: ["Sources/patches/**"]

# Every track's accumulated series IS its stock build. If a patch stops
# applying, that track cannot build at all and every submission to it fails
# with a raw `git apply` error. This ran too late once already: a series
# reorganisation deleted two patches that later ones depended on, and three
# llama.cpp tracks were dead until it was found by hand.
jobs:
  applies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A directory whose name is not a live track id is either a typo or a
      # track that was renamed, and either way the runner will never read it.
      - name: Every series directory must name a live track
        run: |
          status=0
          for dir in Sources/patches/*/; do
            id=$(basename "$dir")
            if ! grep -q "\"$id\"" Sources/contracts.ts; then
              echo "FAIL $id is not a track in Sources/contracts.ts"
              status=1
            fi
          done
          exit $status

      # Renumbering is what broke the tracks last time. Two patches claiming
      # the same ordinal means the apply order depends on the sort, so reject
      # it before it can silently reorder somebody's series.
      - name: No duplicate patch ordinals within a series
        run: |
          status=0
          for dir in Sources/patches/*/; do
            dupes=$(ls "$dir" 2>/dev/null | grep -oE '^[0-9]{4}' | sort | uniq -d || true)
            if [ -n "$dupes" ]; then
              echo "FAIL $dir has duplicate ordinals: $dupes"
              status=1
            fi
          done
          exit $status

      - name: Clone the pinned llama.cpp tree
        run: |
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git /tmp/llama
          git -C /tmp/llama checkout 2b63e0610bbc2be990ae1360d5256efcdc3f9efb

      # Only the GGUF tracks patch llama.cpp. The MLX track also keeps its
      # series under Sources/patches/, but those apply to the installed
      # mlx_lm/mlx Python trees, so applying them here would fail for a reason
      # that says nothing about whether they are valid.
      - name: Every llama.cpp track's series must apply cleanly and in order
        run: |
          status=0
          for dir in Sources/patches/*/; do
            id=$(basename "$dir")
            case "$id" in
              *-gguf-*) ;;
              *) echo "skip $id (not a llama.cpp track)"; continue ;;
            esac
            series=$(ls "$dir"*.patch 2>/dev/null | sort) || continue
            [ -z "$series" ] && continue
            echo "::group::$dir"
            rm -rf /tmp/tree && cp -r /tmp/llama /tmp/tree
            git -C /tmp/tree checkout -q .
            for p in $series; do
              if git -C /tmp/tree apply --index "$GITHUB_WORKSPACE/$p" 2>/dev/null; then
                echo "  ok   $(basename $p)"
              else
                echo "  FAIL $(basename $p) does not apply to the pinned tree"
                status=1
              fi
            done
            echo "::endgroup::"
          done
          exit $status
